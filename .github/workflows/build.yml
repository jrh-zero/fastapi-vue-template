name: Build FastAPI + Vue

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # ✅ Node.js 环境 (必须，否则 npm run build 找不到 vite)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Build frontend
        run: |
          cd frontend
          npm ci   # 推荐用 ci，保证和 package-lock.json 一致
          npx vite build  # 用 npx 确保 vite 可执行

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Package backend
        run: |
          pyinstaller backend/main.py \
          --name myapp \
          --onefile \
          --add-data "frontend/dist:frontend/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastapi-vue-linux
          path: dist/myapp/*
          if-no-files-found: error
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npx vite build

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Package backend
        run: |
          pyinstaller myapp.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastapi-vue-windows
          path: dist/myapp/*
          if-no-files-found: error
          retention-days: 7
